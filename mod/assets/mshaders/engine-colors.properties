# The colour of each unit's engine streaks:   internal-unit-name = rrggbb
# A unit that is not listed keeps the colour of its team.
# These are the colours the units' own sprites are marked with besides grey and the orange of the team cell
# (taken from the sprites: the test kit's "unitcolors=true"; darker shades of the same colour set to the bright one).
# To change one without rebuilding the mod, put a file "mshaders-engine-colors.properties" with the same kind of
# lines into the game's data folder; "name = team" there gives a unit its team's colour back.

