# Block heights, in tiles, for shadow length and mirror image length (Heights.java).
# One block per line:   internal-block-name = height
# A block not listed here gets its height from the built-in rules:
#   conveyors and other blocks units can walk over   0.15
#   walls                                            1 + 0.25 for every tile of size above 1
#   turrets                                          1.1 + 0.3 for every tile of size above 1
#   cores                                            1.5 + 0.4 for every tile of size above 3
#   everything else that stands                      1 + 0.3 for every tile of size above 1
#   the map's own walls                              1.5
#   boulders                                         0.3
# Heights above 3 count as 3. A file named mshaders-heights.properties in the game's data folder
# (the folder that holds "mods" and "saves") is read after this one and wins.
#
# Examples (remove the # to use):
# silicon-smelter = 1.3
# copper-wall = 1.0
