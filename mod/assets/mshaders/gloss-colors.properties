# Gloss by colour (GlossColors.java): how glossy a pixel is, told from the colour its sprite has there.
#
#   colour = gloss             for every sprite
#   name.colour = gloss        for one sprite, or for every sprite of one block (base, head, parts, conveyor frames)
#   name.* = gloss             for every other colour of that sprite or block
#   name.clear = gloss         for where that sprite is transparent (but its normal or height map is not)
#   team = gloss               for where a block's piece in the team's colour lies (the sprite <block>-team);
#   name.team = gloss            it counts before the colour of the base under it
#
# colour: as painted in the sprite in sprites-override, six hex digits, without the # (that starts a comment).
# gloss:  0 .. 255 - the grey you would paint in a gloss map: 0 = matt, 255 = polished metal.
#
# A gloss map (gloss/<sprite>.png) still counts first wherever it is painted; this table fills in where it is
# transparent and for sprites that have none. A colour that is not listed is as glossy as its block as a whole.
# A colour a shade off (2 steps in red, green or blue) counts as the listed one.
# With "read pictures again when they change" on, saving this file shows in the running game.
#
# The numbers below were read off the gloss maps drawn so far (2026-11-19): for each colour the gloss most blocks
# gave it, and a line of its own for each block that gave it another.

