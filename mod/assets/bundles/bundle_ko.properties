mshaders.category = 셰이더
setting.mshaders-water.name = 물 효과
setting.mshaders-water.description = 물에 굴절, 반짝임, 물가 거품을 넣습니다. 그래픽 설정의 "액체 애니메이션 효과"가 켜져 있어야 보입니다.
setting.mshaders-water-wave.name = 물: 굴절 세기
setting.mshaders-water-sparkle.name = 물: 반짝임
setting.mshaders-water-foam.name = 물: 물가 거품
setting.mshaders-post.name = 화면 색 보정
setting.mshaders-post.description = 게임 화면에 비네트와 색 보정을 겹칩니다. 픽셀화가 켜져 있으면 쉬어 갑니다.
setting.mshaders-vignette.name = 비네트(가장자리 어둡게)
setting.mshaders-saturation.name = 채도
setting.mshaders-contrast.name = 대비
setting.mshaders-warmth.name = 색온도
setting.mshaders-spare.name = 에르키르: 진한 색은 덜 보정
setting.mshaders-spare.description = 에르키르는 게임이 화면 전체에 붉은 안개를 덧칠합니다. 그곳에서는 이미 진한 색에 위의 채도와 대비를 덜 걸어, 행성이 붉게 달아오르지 않게 합니다. 다른 행성의 화면은 바뀌지 않습니다. 끄면 에르키르도 다른 맵과 똑같이 보정합니다.
setting.mshaders-shadow.name = 방향 그림자
setting.mshaders-shadow.description = 블록 그림자가 블록 바로 밑이 아니라 유닛 그림자처럼 왼쪽 아래로 드리웁니다.
setting.mshaders-shadow-length.name = 그림자 길이(칸)
setting.mshaders-shadow-strength.name = 그림자 진하기
setting.mshaders-reflect.name = 물 반사
setting.mshaders-reflect.description = 물 바로 위쪽(북쪽)에 있는 건물, 유닛, 총알이 물에 비칩니다. "물 효과"가 켜져 있어야 합니다.
setting.mshaders-reflect-strength.name = 반사 세기
setting.mshaders-lights.name = 블록에 가려지는 빛
setting.mshaders-lights.description = 광원(조명, 총알, 유닛, 발전기, 코어)의 빛이 블록 뒤로 넘어가지 않아 그늘이 생깁니다. 어두운 맵에서는 게임 조명 자체가 그렇게 그려지고, 밝은 맵에서는 광원 주변이 은은하게 밝아집니다.
setting.mshaders-lights-units.name = 유닛도 빛을 가림
setting.mshaders-lights-units.description = 유닛이 조명·총알·다른 유닛의 빛을 가려 그림자를 냅니다. 높이에 따라 다릅니다: 몸통은 키만큼 긴 그림자를, 발은 작은 그림자를, 다리 달린 유닛의 다리는 다리에서 떨어진 자리에 그림자를 드리우고, 다리로 들린 몸통과 나는 유닛 밑으로는 빛이 지나갑니다. 높이는 유닛 크기와 다리 길이로 정한 값입니다. "블록에 가려지는 빛"이 켜져 있어야 합니다.
setting.mshaders-lights-units-depth.name = 유닛 그림자 진하기
setting.mshaders-lights-units-depth.description = 유닛이 가린 자리에서 빛을 얼마나 덜어 내는지입니다. 100% = 블록처럼 전부, 낮출수록 그림자가 옅어집니다.
setting.mshaders-lights-strength.name = 빛 세기
setting.mshaders-glint.name = 금속 반짝임
setting.mshaders-glint.description = 블록에서 빛 쪽으로 기운 면에 하이라이트가 얹히고, 햇빛 띠가 기지 위를 천천히 지나갑니다. 띠는 아래 슬라이더를 0으로 내리면 꺼집니다.
setting.mshaders-glint-strength.name = 반짝임 세기
mshaders.off = 끔
setting.mshaders-glint-band.name = 반짝임: 지나가는 햇빛 띠
mshaders.minutes = {0}분
setting.mshaders-shadow-cycle.name = 그림자 길이 변화: 한 바퀴
setting.mshaders-ice.name = 얼음 효과
setting.mshaders-ice.description = 얼음 바닥에 시점에 따라 미끄러지는 광택, 서리 반짝임, 속 균열이 생기고 위에 있는 것이 비칩니다. 그래픽 설정의 "액체 애니메이션 효과"가 켜져 있어야 합니다.
setting.mshaders-ice-strength.name = 얼음 효과 세기
setting.mshaders-dark-depth.name = 어두운 맵: 빛에서 멀수록 더 어둡게
setting.mshaders-dark-depth.description = 어둠이 있는 맵에서 빛과 멀어질수록 점점 더 어두워집니다. 100%면 빛이 닿지 않는 먼 곳은 완전히 검게 됩니다. "블록에 가려지는 빛"이 켜져 있어야 합니다.
setting.mshaders-lights-color.name = 어두운 맵: 조명 색 강조
setting.mshaders-lights-color.description = 어둠이 있는 맵에서 빛이 닿은 곳이 조명의 색으로 물듭니다(조명 색은 조명을 눌러 바꿉니다). 색만 입히고 더 밝게 하지는 않습니다. "블록에 가려지는 빛"이 켜져 있어야 합니다.
setting.mshaders-lights-moving.name = 움직이는 빛 세기 (총알·빔·폭발)
setting.mshaders-lights-moving.description = 총알, 레이저, 드릴 빔, 채굴 빔, 폭발 같은 효과가 내는 빛을 키웁니다. 100%면 게임이 정한 그대로입니다. 게임은 총알에 작고 약한 빛만 주기 때문에(두 칸 남짓, 세기 0.3) 등불 옆에서는 거의 안 보입니다. 400%면 세기 4배(최대 1), 반경 2배. 건물 한가운데의 빛(조명, 코어 등), 유닛 자체의 빛, 전력 노드 사이의 선은 그대로 둡니다.
setting.mshaders-lights-max.name = 광원 한도
setting.mshaders-lights-max.description = 한 화면에서 계산에 넣는 광원의 수. 보이는 광원이 이보다 많으면 센 것부터 고릅니다. 높이면 큰 전투에서 총알 빛이 빠지지 않지만, 광원 수만큼 계산이 늘어 느려집니다. 기본 64. 그래픽 카드가 긴 목록을 받지 못하면 64에서 멈춥니다.
setting.mshaders-lights-air.name = 공중 유닛 불빛 높이
setting.mshaders-lights-air.description = 날고 있는 유닛의 불빛을 땅이 아니라 공중에 떠 있는 것으로 계산합니다. 블록 윗면은 주변에 무엇이 있든 빛을 받고, 벽은 빛을 통째로 막는 대신 유닛 반대쪽으로 짧은 그림자를 드리우며(유닛에서 멀수록 길어짐), 바닥의 빛은 더 넓고 고르고 조금 옅어집니다. 노멀맵 블록은 더 위쪽에서 빛을 받습니다. 100% = 3칸 높이. 끔 = 게임처럼 땅 높이. 지상 유닛의 빛은 그대로이고, 총알은 아래에 따로 설정이 있습니다. "블록에 가려지는 빛"이나 "노멀맵 조명"이 켜져 있어야 합니다.
setting.mshaders-lights-shots.name = 총알 높이
setting.mshaders-lights-shots.description = 총알·미사일·레이저는 벽 위로 넘어가므로, 그 빛도 지나가는 벽마다 잘리지 않고 벽 위를 나는 것으로 계산합니다. 포탑이나 지상 유닛이 쏜 총알은 이 높이에서 시작해 조준한 곳(또는 사거리 끝)에 가까워질수록 내려옵니다. 포탄은 포물선을 그리고, 공중 유닛을 겨눈 총알은 올라가며, 레이저는 같은 높이로 뻗습니다. 바닥의 빛은 공중 유닛처럼 더 넓고 옅어집니다. 100% = 2칸 높이. 끔 = 게임처럼 땅 높이(공중 유닛이 쏜 총알은 그대로 유닛 높이에서 시작). 빛은 "블록에 가려지는 빛"이나 "노멀맵 조명"이 켜져 있어야 하고, "총알 그림자"도 이 높이를 따릅니다.
setting.mshaders-shot-shadows.name = 총알 그림자
setting.mshaders-shot-shadows.description = 떠 있는 총알·미사일·포탄·폭탄이 공중 유닛처럼 작은 그림자를 드리웁니다. 총알이 높을수록("총알 높이") 그림자가 왼쪽 아래로 멀어지고, 총알이 내려올수록 가까워집니다. 빔·화염·번개는 그림자가 없습니다. 유닛과 마찬가지로, 물 반사가 켜져 있으면 물 위에는 그리지 않습니다.
setting.mshaders-lights-ground.name = 빛나는 바닥
setting.mshaders-lights-ground.description = 빛을 내는 바닥(용암, 마그마 바위, 뜨거운 바위, 냉각수)의 빛입니다. 게임이 타일마다 광원을 하나씩 내기 때문에 다른 광원과 따로, 개수 제한 없이 그리며 블록에 가려지지 않습니다. 올리면 더 밝고 더 멀리 퍼지고, 노멀맵 블록은 빛나는 바닥을 향한 옆면이 더 밝아집니다. 어두운 맵에서는 100%가 게임이 그리는 세기입니다. 색은 게임이 알려 주는 것보다 조금 진하게 씁니다(용암이 노랑보다 주황으로 빛남). 끔 = 바닥이 빛을 내지 않음. "블록에 가려지는 빛"이나 "노멀맵 조명"이 켜져 있어야 합니다.
setting.mshaders-floors.name = 바닥 효과
setting.mshaders-floors.description = 암석, 모래, 눈, 소금, 풀, 뜨거운 바위, 금속 바닥에 얼음처럼 각자 어울리는 효과가 생깁니다. 종류별 세기를 0으로 두면 그 바닥은 원래대로 그려집니다. 그래픽 설정의 "액체 애니메이션 효과"가 켜져 있어야 합니다.
setting.mshaders-floor-rock.name = 암석: 균열
setting.mshaders-floor-sand.name = 모래: 바람결
setting.mshaders-floor-snow.name = 눈·소금: 반짝임
setting.mshaders-floor-grass.name = 풀·이끼: 바람
setting.mshaders-floor-hot.name = 뜨거운 바위: 달아오름
setting.mshaders-floor-metal.name = 금속 바닥: 광택
setting.mshaders-floor-relief.name = 바닥: 입체감
setting.mshaders-floor-relief.description = 타일에서 밝게 그려진 부분을 높은 곳으로 보고 오른쪽 위에서 빛을 비춘 것처럼 요철을 넣습니다. 위의 바닥 종류 중 세기가 0이 아닌 것에 적용됩니다(뜨거운 바위 제외).
setting.mshaders-normals.name = 노멀맵 조명
setting.mshaders-normals.description = 노멀맵이 있는 블록은 그려진 명암 대신 계산으로 빛을 받습니다(오른쪽 위의 해와 주변 광원). 이런 블록의 스프라이트는 명암이 없는 밑색 그림이라, 이 설정을 끄면 밋밋하게 보입니다. 지금은 실리콘 제련소만 해당합니다.
setting.mshaders-normals-strength.name = 노멀맵 조명 세기
setting.mshaders-normals-metal.name = 금속 느낌
setting.mshaders-normals-metal.description = 광택 맵이 흰색(또는 거의 흰색)인 곳을 금속으로 칠합니다. 금속은 주변을 비추므로 해와 조명 쪽 면은 밝고 나머지는 어두우며, 평평한 면에는 하늘이 밝은 띠로 비칩니다. 끄면 전처럼 광택만 납니다.
setting.mshaders-normals-height.name = 높이맵 우선
setting.mshaders-boosters.name = 부스터 불꽃
setting.mshaders-boosters.description = 유닛의 부스터를 불꽃으로 그립니다. 빨리 날수록 길어지고, 제자리에 떠 있으면 짧습니다. 끄면 게임 원래의 동그라미 두 개로 돌아갑니다.
setting.mshaders-boosters-tint.name = 부스터를 유닛의 색으로
setting.mshaders-boosters-tint.description = 제 색이 있는 유닛(초록색 지원 유닛, 보라색·파란색 유닛)은 부스터 불꽃도 그 색으로 나옵니다. 끄면 게임처럼 모든 불꽃이 팀 색입니다.
setting.mshaders-boosters-breath.name = 부스터: 커졌다 작아졌다 하는 정도
setting.mshaders-boosters-breath.description = 불꽃이 계속 커졌다 작아졌다 하고 길이와 밝기가 떨리는 정도입니다. 100%가 게임 원래의 부스터와 같습니다. 끄면 가만히 있고, 유닛의 속도와 방향 전환에 따라서만 달라집니다.
setting.mshaders-engines-edit.name = 부스터 꾸미기...
mshaders.engines.title = 부스터 꾸미기
mshaders.engines.style.plain = 기본
mshaders.engines.style.rings = 고리
mshaders.engines.style.arcs = 호
mshaders.engines.style.pulses = 구슬
mshaders.engines.colour.team = 팀 색
mshaders.engines.colour.own = 유닛의 색
mshaders.engines.colour.custom = 직접 고르기...
mshaders.engines.noown = 이 유닛은 제 색이 없어서 "유닛의 색"을 고르면 팀 색으로 나옵니다.
mshaders.engines.length = 길이
mshaders.engines.width = 굵기
mshaders.engines.reset = 모드 기본값으로
setting.mshaders-normals-own-light.name = 유닛과 코어가 자기 빛을 받음
setting.mshaders-normals-own-light.description = 유닛과 코어는 한가운데에 빛을 지니고 있습니다. 끄면 그 빛은 그 유닛이나 코어 자신의 명암에는 들어가지 않습니다(주변은 그대로 비춥니다). 켜면 들어가서 안에서 빛을 받은 것처럼 보입니다. 노멀맵이 있는 유닛과 코어에만 해당합니다.
setting.mshaders-normals-height.description = 한 스프라이트에 노멀맵과 높이맵이 둘 다 있을 때 어느 쪽을 쓸지 정합니다. 켜면 높이맵, 끄면 노멀맵. 한쪽만 있는 스프라이트는 있는 것을 씁니다.
setting.mshaders-shadow-quality.name = 그림자 품질(또렷함)
setting.mshaders-shadow-quality.description = 100%면 그림자가 블록 모양 그대로 또렷한 테두리로 떨어집니다. 낮출수록 테두리가 부드럽고 넓게 번지며, 블록에서 멀수록 더 번집니다.
setting.mshaders-sun-angle.name = 해 방향
setting.mshaders-sun-angle.description = 해가 있는 쪽입니다. 0 = 오른쪽, 90 = 위. 그림자는 반대쪽으로 떨어지고, 노멀맵 블록과 바닥 입체감은 그쪽에서 빛을 받습니다. 게임 스프라이트에 그려진 명암과 유닛 그림자는 항상 오른쪽 위(45)를 기준으로 하므로, 다른 값에서는 그것들과 어긋납니다.
setting.mshaders-section-water.name = 물 · 얼음 · 반사
setting.mshaders-section-ground.name = 바닥
setting.mshaders-section-shadow.name = 그림자
setting.mshaders-section-lights.name = 조명
setting.mshaders-section-blocks.name = 블록: 반짝임과 노멀맵
setting.mshaders-section-units.name = 유닛
setting.mshaders-dev-watch.name = 셰이더: 그림이 바뀌면 바로 다시 읽기
setting.mshaders-dev-watch.description = 노멀맵, 높이맵, 광택맵, 덮어쓰는 그림이 저장되거나 추가되거나 지워졌는지 1초에 두 번 살펴보고, 바뀌었으면 다시 읽습니다. 그림을 저장하면 1~2초 뒤 켜져 있는 게임에 나옵니다. 끄면 게임을 시작할 때와 아래의 버튼을 누를 때만 읽습니다. 살펴보는 곳: 게임 데이터 폴더의 mshaders-normals, mshaders-heightmaps, mshaders-gloss, 그리고 mshaders-watch.txt 파일이 있으면 거기 적힌 폴더.
setting.mshaders-dev-button.name = 셰이더: 그림 다시 읽기 버튼
setting.mshaders-dev-button.description = 게임하는 동안 화면 왼쪽 가장자리에 버튼을 둡니다. 누르면 노멀맵, 높이맵, 광택맵, 덮어쓰는 그림을 파일에서 한 번에 다시 읽습니다.
setting.mshaders-dev-gloss-table.name = 셰이더: 색 표로만 광택 정하기 (광택맵 빼기)
setting.mshaders-dev-gloss-table.description = 비교용입니다. 광택맵을 읽지 않고, 모든 픽셀의 광택을 색 → 광택 표(mshaders/gloss-colors.properties: 밑그림의 색 = 광택)에서 가져옵니다. 광택맵이 있을 때와 똑같이 보이는 블록은 광택맵이 필요 없는 것입니다.
mshaders.dev.reload = 그림 다시 읽기
mshaders.dev.reloaded = 다시 읽음: 노멀맵 {0}, 높이맵 {1}, 광택맵 {2}, 그림 {3}
setting.mshaders-section-post.name = 화면 색
setting.mshaders-reactor-fun.name = ReactorFUNvalue
setting.mshaders-reactor-fun.description = 토륨 원자로가 터질 때 나는 보라색 빛을 몇 배로 키울지 정합니다. 원자로를 한 번 터뜨려야 보이는 설정입니다.
mshaders.reactorfound = 토륨이 더 밝게 빛나고 싶어합니다.
setting.mshaders-dev-clock.name = 셰이더: 단계별 시간 보기
setting.mshaders-dev-clock.description = 게임하는 동안 화면 가운데에, 이 기기에서 모드의 각 단계가 한 프레임에 몇 밀리초를 쓰는지 보여 줍니다(단계마다 그래픽 칩이 일을 끝낼 때까지 기다리므로, 켜 둔 동안은 평소보다 느립니다). 어느 효과가 무거운지 찾는 용도입니다.
mshaders.clock.title = 단계별 시간 (ms/프레임, 재는 동안 느림)
mshaders.clock.whole = 프레임 전체
mshaders.clock.rest = 나머지 (게임 자체, 물)
mshaders.clock.end = 프레임 끝: 색 보정·빛·반짝임 입히기
mshaders.clock.light = 블록에 가려지는 빛
mshaders.clock.gamelight = 어두운 맵 조명
mshaders.clock.shadow = 방향 그림자
mshaders.clock.shadowtop = 블록 위의 그림자
mshaders.clock.ground = 바닥 효과
mshaders.clock.ice = 얼음
mshaders.clock.shape = 노멀맵 조명: 블록
mshaders.clock.heads = 노멀맵 조명: 포탑 머리
mshaders.clock.unitshape = 노멀맵 조명: 유닛
mshaders.clock.units = 빛을 가리는 유닛 그림
mshaders.clock.cover = 유닛이 있는 자리 그림
mshaders.clock.copy = 화면 복사 (반사용)
mshaders.clock.mirror = 물 반사 그림
mshaders.clock.shots = 총알 그림자
mshaders.clock.upload = 맵 그림 다시 올리기 (블록이 바뀜)
setting.mshaders-light-squares.name = 셰이더: 빛을 칸으로 나눠 계산
setting.mshaders-light-squares.description = 광원 목록을 훑는 두 단계(블록에 가려지는 빛, 노멀맵 조명)를 화면 전체에 모든 광원으로 한 번에 그리지 않고, 24칸으로 나눠 칸마다 닿는 광원만으로 그립니다. 그림은 같고, 빨라지는지는 기기마다 다릅니다. "단계별 시간 보기"로 비교하세요.
mshaders.clock.blur = 빛 번지게 하기
setting.mshaders-lights-detail.name = 빛 그림 크기
setting.mshaders-lights-detail.description = 블록에 가려지는 빛은 작은 그림에 계산한 뒤 화면에 늘려 입힙니다. 100%면 가로세로가 화면의 4분의 1입니다. 줄이면 훨씬 빨라지고(50%면 계산이 4분의 1) 빛과 그늘의 경계가 더 부드러워집니다. 폰에서 가장 무거운 단계이니 폰에서는 50%를 써 보세요. 어두운 맵의 조명도 같은 그림을 씁니다.
mshaders.clock.aim = 빛의 방향 (금속 반짝임용)
