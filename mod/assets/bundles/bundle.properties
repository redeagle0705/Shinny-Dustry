mshaders.category = Shaders
setting.mshaders-water.name = Fancy water
setting.mshaders-water.description = Refraction, glints and shore foam on water. Needs "Animated Surfaces" in Graphics to be on.
setting.mshaders-water-wave.name = Water: refraction
setting.mshaders-water-sparkle.name = Water: glints
setting.mshaders-water-foam.name = Water: shore foam
setting.mshaders-post.name = Screen colour pass
setting.mshaders-post.description = Vignette and colour grading over the world. Off while Pixelate is on (so are reflections, lights and glint).
setting.mshaders-vignette.name = Vignette
setting.mshaders-saturation.name = Saturation
setting.mshaders-contrast.name = Contrast
setting.mshaders-warmth.name = Warmth
setting.mshaders-spare.name = Erekir: spare vivid colours
setting.mshaders-spare.description = On Erekir the game lays a red haze over the whole picture. There, colours that are vivid already get less of the saturation and contrast above, so the planet does not glow red. Other planets are not changed. Off: Erekir is treated like every other map.
setting.mshaders-shadow.name = Directional block shadows
setting.mshaders-shadow.description = Block shadows fall to the lower left, like unit shadows, instead of sitting under the block.
setting.mshaders-shadow-length.name = Shadow length (tiles)
setting.mshaders-shadow-strength.name = Shadow darkness
setting.mshaders-reflect.name = Water reflections
setting.mshaders-reflect.description = Buildings, units and shots just north of water are mirrored in it. Needs "Fancy water".
setting.mshaders-reflect-strength.name = Reflection strength
setting.mshaders-lights.name = Lights blocked by blocks
setting.mshaders-lights.description = Light from lamps, shots, units, generators and cores does not pass blocks, so they cast shade. On dark maps the game lighting itself is drawn that way; on bright maps light sources softly light their surroundings.
setting.mshaders-lights-units.name = Units cast shadows from lights
setting.mshaders-lights-units.description = Units stand in the way of the light of lamps, shots and other units, each by its height: a body throws a shadow as long as it is tall against the lamp, feet throw small ones, the legs of walkers throw shadows that lie apart from the legs, and light passes under whatever is carried on legs or flies. The heights are made up from the size of the unit and the length of its legs. Needs "Lights blocked by blocks".
setting.mshaders-lights-units-depth.name = Unit shadows: depth
setting.mshaders-lights-units-depth.description = How much of a light a unit takes away where it stands in the way. 100% = all of it, as a block does; lower = fainter shadows.
setting.mshaders-lights-strength.name = Light strength
setting.mshaders-glint.name = Metal glint
setting.mshaders-glint.description = Faces of blocks that lean towards the light catch a highlight; a band of sunlight drifts across the base.
setting.mshaders-glint-strength.name = Glint strength
mshaders.off = off
setting.mshaders-glint-band.name = Glint: drifting sun band
mshaders.minutes = {0} min
setting.mshaders-shadow-cycle.name = Shadows grow and shrink: one cycle
setting.mshaders-ice.name = Ice
setting.mshaders-ice.description = Ice floor gets a sheen that slides with the view, frost glints, cracks under the surface, and mirrors what stands on it. Needs "Animated Surfaces" in Graphics.
setting.mshaders-ice-strength.name = Ice strength
setting.mshaders-dark-depth.name = Dark maps: darker the farther from light
setting.mshaders-dark-depth.description = On maps with darkness, places far from every light get darker still; at 100% they are pitch black. Needs "Lights blocked by blocks".
setting.mshaders-lights-color.name = Dark maps: colour of the light
setting.mshaders-lights-color.description = On maps with darkness, lit ground takes the colour of the lamp (set a lamp's colour by tapping it). Only the hue is used, the place gets no brighter. Needs "Lights blocked by blocks".
setting.mshaders-lights-moving.name = Moving lights (shots, beams, explosions)
setting.mshaders-lights-moving.description = Makes the light of shots, lasers, drill beams, mining beams and effects such as explosions stronger. 100% is what the game reports: a shot has only a small, weak light (about two tiles across, opacity 0.3), hardly seen next to a lamp. 400% is four times the opacity (1 at most) and twice the radius. Lights in the middle of a building (lamps, cores), the glow of units themselves and the lines between power nodes are left as they are.
setting.mshaders-lights-max.name = Light limit
setting.mshaders-lights-max.description = How many light sources are counted on one screen. If more are in view, the strongest are kept. Higher keeps the lights of shots in a big fight, but every light is more work per pixel. Default 64. Stops at 64 if the graphics card does not take a longer list.
setting.mshaders-lights-air.name = Light of flying units: height
setting.mshaders-lights-air.description = The glow of a unit in flight is worked out as hanging in the air instead of sitting on the ground. The tops of blocks are lit whatever stands around them; a wall throws a short shadow away from the unit (longer the further from it) instead of cutting its light off; the pool of light on the ground is wider, more even and a little fainter; normal-mapped blocks are lit more from above. 100% = three tiles up. Off = on the ground, as in the game. The lights of ground units are not changed; shots have a setting of their own, below. Needs "Lights blocked by blocks" or "Normal-map lighting".
setting.mshaders-lights-shots.name = Height of shots
setting.mshaders-lights-shots.description = Bullets, missiles and lasers pass over walls, so their light is worked out as flying above the walls too, instead of being cut off by every wall on the way. A shot fired from a turret or a ground unit starts this high and sinks as it nears the place it was aimed at (or the end of its range); artillery shells fly in an arc; shots at flying units climb; lasers run level. The light on the ground is wider and fainter, as with flying units. 100% = two tiles up. Off = on the ground, as in the game (shots of flying units still start at their unit). The light needs "Lights blocked by blocks" or "Normal-map lighting"; "Shadows of shots" goes by this height too.
setting.mshaders-shot-shadows.name = Shadows of shots
setting.mshaders-shot-shadows.description = Bullets, missiles, shells and bombs that are off the ground throw a small shadow, like flying units do: the further to the lower left, the higher the shot is ("Height of shots"), and it closes in as the shot comes down. Beams, flames and lightning throw none. No shadow on water while reflections are on, as with units.
setting.mshaders-lights-ground.name = Glowing ground
setting.mshaders-lights-ground.description = The glow of ground that gives off light: molten slag, magma rock, hot rock, cryofluid. The game reports one light per tile, so these are painted apart from the other lights, any number of them, and blocks do not stop them. Stronger means brighter and reaching further; normal-mapped blocks are lit more on the sides that face the glowing ground. On a dark map 100% is as strong as the game draws it. The colour is made a little deeper than the game reports it (slag glows orange rather than yellow). Off = glowing ground gives no light. Needs "Lights blocked by blocks" or "Normal-map lighting".
setting.mshaders-floors.name = Ground
setting.mshaders-floors.description = Rock, sand, snow, salt, grass, hot rock and metal floors each get a little life of their own, like the ice. Set a kind to 0 to leave it as it is. Needs "Animated Surfaces" in Graphics.
setting.mshaders-floor-rock.name = Rock: cracks
setting.mshaders-floor-sand.name = Sand: wind ripples
setting.mshaders-floor-snow.name = Snow and salt: sparkle
setting.mshaders-floor-grass.name = Grass and moss: wind
setting.mshaders-floor-hot.name = Hot rock: glow
setting.mshaders-floor-metal.name = Metal floor: sheen
setting.mshaders-floor-relief.name = Ground: relief
setting.mshaders-floor-relief.description = The ground looks embossed: what is painted lighter on a tile stands higher and is lit from the upper right. Applies to the kinds of ground above that are not set to 0 (not hot rock).
setting.mshaders-normals.name = Normal-map lighting
setting.mshaders-normals.description = Blocks that have a normal map are lit by calculation: the sun from the upper right and the lights around them. Their sprite is a plain one without painted shading, so with this off they look flat. For now only the silicon smelter has one.
setting.mshaders-normals-strength.name = Normal-map lighting strength
setting.mshaders-normals-metal.name = Metal look
setting.mshaders-normals-metal.description = Where a gloss map is white (or nearly), the face is shaded as metal: it mirrors what is around it, so faces turned to the sun and to lamps are bright, the others dark, and a bright bar of sky lies across flat faces. Off: such faces are only polished, as before.
setting.mshaders-normals-height.name = Prefer height maps
setting.mshaders-boosters.name = Engine flames
setting.mshaders-boosters.description = The engines of units are drawn as flames: longer the faster the unit flies, short while it hovers. Off: the two discs the game draws.
setting.mshaders-boosters-tint.name = Engine flames in the unit's colour
setting.mshaders-boosters-tint.description = Units marked with a colour of their own - the green support units, the purple and the blue ones - get engine flames of that colour. Off: every flame has the colour of the unit's team, as in the game.
setting.mshaders-boosters-breath.name = Engine flames: breathing
setting.mshaders-boosters-breath.description = How much the flames swell and shrink all the time and waver in length and brightness. 100% is what the game's own engines do. Off: they stand still, and change only with the unit's speed and turning.
setting.mshaders-engines-edit.name = Dress the engines...
mshaders.engines.title = Engine flames
mshaders.engines.style.plain = Plain
mshaders.engines.style.rings = Rings
mshaders.engines.style.arcs = Bows
mshaders.engines.style.pulses = Pulses
mshaders.engines.colour.team = Team colour
mshaders.engines.colour.own = Unit's colour
mshaders.engines.colour.custom = Pick...
mshaders.engines.noown = This unit has no colour of its own: "Unit's colour" gives it its team's.
mshaders.engines.length = Length
mshaders.engines.width = Width
mshaders.engines.reset = As the mod has it
setting.mshaders-normals-own-light.name = Units and cores lit by their own glow
setting.mshaders-normals-own-light.description = A unit carries a glow in its middle, and so does a core. Off: that glow does not count for the shading of the unit or core itself (it still lights everything around it). On: it does, and they look lit from inside. Only for units and cores that have a normal map.
setting.mshaders-normals-height.description = Which picture is used where a sprite has both a normal map and a height map: on = the height map, off = the normal map. A sprite with only one of them uses the one it has.
setting.mshaders-shadow-quality.name = Shadow quality (sharpness)
setting.mshaders-shadow-quality.description = 100%: shadows have the exact outline of their block with crisp edges. Lower: the edges get softer and wider, the more so the further from the block.
setting.mshaders-sun-angle.name = Sun direction
setting.mshaders-sun-angle.description = Where the sun stands: 0 = right, 90 = top. Shadows fall the other way; normal-mapped blocks and the ground relief are lit from there. The shading painted into the game's own sprites and the shadows of units always assume the upper right (45), so other values do not match those.
setting.mshaders-section-water.name = Water, ice, reflections
setting.mshaders-section-ground.name = Ground
setting.mshaders-section-shadow.name = Shadows
setting.mshaders-section-lights.name = Lights
setting.mshaders-section-blocks.name = Blocks: glint and normal maps
setting.mshaders-section-units.name = Units
setting.mshaders-dev-watch.name = Shaders: read pictures again when they change
setting.mshaders-dev-watch.description = Twice a second the mod looks whether a normal map, height map, gloss map or sprite has been saved, added or removed, and reads them again - a drawing shows in the running game a second or two after it is saved. Off: they are read when the game starts, and when the button below is pressed. Watched: mshaders-normals, mshaders-heightmaps and mshaders-gloss in the game's data folder, and the folder named in mshaders-watch.txt if there is such a file.
setting.mshaders-dev-button.name = Shaders: button to read pictures again
setting.mshaders-dev-button.description = Puts a button at the left edge of the screen while you play. Pressed, it reads every normal map, height map, gloss map and replaced sprite again from its file, all at once.
setting.mshaders-dev-gloss-table.name = Shaders: gloss by colour only (leave out the gloss maps)
setting.mshaders-dev-gloss-table.description = To compare: the gloss maps are not read, and every pixel takes its gloss from the table of gloss by colour (mshaders/gloss-colors.properties: colour of the sprite = gloss). Where this looks the same as with the maps, the map is not needed.
mshaders.dev.reload = Read pictures again
mshaders.dev.reloaded = Read again: {0} normal map(s), {1} height map(s), {2} gloss map(s), {3} sprite(s)
setting.mshaders-section-post.name = Screen colours
setting.mshaders-reactor-fun.name = ReactorFUNvalue
setting.mshaders-reactor-fun.description = How much stronger the purple glow of an exploding thorium reactor is. You found this by blowing one up.
mshaders.reactorfound = Thorium wants to shine brighter.
setting.mshaders-dev-clock.name = Shaders: time of each step
setting.mshaders-dev-clock.description = Shows, in the middle of the screen while you play, how many milliseconds of a frame each step of the mod takes on this device (the graphics card is made to finish each step before the next, so the game runs slower than usual while this is on). For finding out which effect is the heavy one.
mshaders.clock.title = Time of each step (ms a frame, slower while measured)
mshaders.clock.whole = whole frame
mshaders.clock.rest = everything else (the game itself, water)
mshaders.clock.end = end of frame: colours, light, glint laid on
mshaders.clock.light = light stopped by blocks
mshaders.clock.gamelight = dark map: lighting
mshaders.clock.shadow = sun shadows
mshaders.clock.shadowtop = shadows on blocks
mshaders.clock.ground = ground effects
mshaders.clock.ice = ice
mshaders.clock.shape = normal maps: blocks
mshaders.clock.heads = normal maps: turret heads
mshaders.clock.unitshape = normal maps: units
mshaders.clock.units = units in the way of light
mshaders.clock.cover = where the units are
mshaders.clock.copy = copies of the picture (for reflections)
mshaders.clock.mirror = mirror picture (water reflection)
mshaders.clock.shots = shadows of shots
mshaders.clock.upload = map pictures sent again (blocks changed)
setting.mshaders-light-squares.name = Shaders: lights square by square
setting.mshaders-light-squares.description = The two steps that go through the list of lights (light stopped by blocks, normal-map shading) are drawn in 24 squares, each with only the lights that reach it, instead of the whole screen with every light. The picture is the same; whether it is faster depends on the device - compare with "time of each step".
mshaders.clock.blur = light, smoothed
setting.mshaders-lights-detail.name = Light picture size
setting.mshaders-lights-detail.description = The light that blocks stop is worked out in a small picture and stretched over the screen: a quarter of the screen each way at 100%. Smaller is much faster - at 50% a quarter of the work - and the edges of light and shade get softer. This is the heaviest step on a phone; try 50% there. Dark maps use the same picture.
mshaders.clock.aim = direction of light (for the glint)
